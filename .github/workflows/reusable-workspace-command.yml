name: Reusable Workspace Command

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      runs_on:
        required: false
        type: string
        default: windows-2025-vs2026
      python_version:
        required: false
        type: string
        default: "3.12"
      node_version:
        required: false
        type: string
        default: ""
      node_cache_dependency_path:
        required: false
        type: string
        default: ""
      app_repository:
        required: false
        type: string
        default: emulebb/emulebb
      app_ref:
        required: false
        type: string
        default: ""
      amutorrent_repository:
        required: false
        type: string
        default: emulebb/amutorrent
      amutorrent_ref:
        required: false
        type: string
        default: ""
      build_ref:
        required: false
        type: string
        default: main
      artifact_name:
        required: false
        type: string
        default: ""
      artifact_path:
        required: false
        type: string
        default: ""
      artifact_retention_days:
        required: false
        type: number
        default: 14
      failure_artifact_name:
        required: false
        type: string
        default: ""
      failure_artifact_path:
        required: false
        type: string
        default: ""
      failure_artifact_retention_days:
        required: false
        type: number
        default: 14
      timeout_minutes:
        required: false
        type: number
        default: 360

permissions:
  contents: read

jobs:
  run:
    name: workspace command
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Set workspace output root
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = [System.IO.Path]::GetFullPath((Join-Path $env:EMULEBB_WORKSPACE_ROOT '..\emulebb-output'))
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          "EMULEBB_WORKSPACE_OUTPUT_ROOT=$outputRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
          if ([string]::IsNullOrWhiteSpace($env:CARGO_TARGET_DIR)) {
            $cargoTargetDir = Join-Path $outputRoot "builds\rust\target"
            New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
            "CARGO_TARGET_DIR=$cargoTargetDir" | Add-Content -LiteralPath $env:GITHUB_ENV
          }

      - name: Checkout build orchestration
        uses: actions/checkout@v6
        with:
          repository: emulebb/emulebb-build
          ref: ${{ inputs.build_ref }}
          path: repos/emulebb-build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install build orchestration dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install "click>=8.1" "pydantic>=2.0" "jinja2>=3" "jsonschema>=4" "PyYAML>=6" "pywin32" "pywinauto"

      - name: Materialize workspace
        shell: pwsh
        working-directory: repos/emulebb-build
        run: |
          $ErrorActionPreference = "Stop"
          python -m emule_workspace materialize

      - name: Checkout aMuTorrent source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.amutorrent_repository }}
          path: repos/amutorrent

      - name: Align requested source refs
        shell: pwsh
        env:
          APP_REPOSITORY: ${{ inputs.app_repository }}
          APP_REF: ${{ inputs.app_ref }}
          AMUTORRENT_REPOSITORY: ${{ inputs.amutorrent_repository }}
          AMUTORRENT_REF: ${{ inputs.amutorrent_ref }}
        run: |
          $ErrorActionPreference = "Stop"

          function Reset-RepoRef {
            param(
              [Parameter(Mandatory = $true)][string]$RepoPath,
              [Parameter(Mandatory = $true)][string]$Repository,
              [string]$Ref,
              [Parameter(Mandatory = $true)][string]$Branch
            )

            if ([string]::IsNullOrWhiteSpace($Ref)) {
              return
            }

            $remoteUrl = "https://github.com/$Repository.git"
            git -C $RepoPath fetch --tags $remoteUrl $Ref
            git -C $RepoPath checkout $Branch
            git -C $RepoPath reset --hard FETCH_HEAD
            git -C $RepoPath status --short --branch
          }

          Reset-RepoRef `
            -RepoPath (Join-Path $env:EMULEBB_WORKSPACE_ROOT "workspaces\workspace\app\emulebb-main") `
            -Repository $env:APP_REPOSITORY `
            -Ref $env:APP_REF `
            -Branch "main"

          Reset-RepoRef `
            -RepoPath (Join-Path $env:EMULEBB_WORKSPACE_ROOT "repos\amutorrent") `
            -Repository $env:AMUTORRENT_REPOSITORY `
            -Ref $env:AMUTORRENT_REF `
            -Branch "main"

      - name: Set up Node
        if: ${{ inputs.node_version != '' && inputs.node_cache_dependency_path == '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Node with npm cache
        if: ${{ inputs.node_version != '' && inputs.node_cache_dependency_path != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.node_cache_dependency_path }}

      - name: Run workspace command
        shell: pwsh
        working-directory: repos/emulebb-build
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PYTHONPATH = Join-Path $env:EMULEBB_WORKSPACE_ROOT "repos\emulebb-build"
          ${{ inputs.command }}

      - name: Audit workspace artifacts
        shell: pwsh
        working-directory: repos/emulebb-build
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PYTHONPATH = Join-Path $env:EMULEBB_WORKSPACE_ROOT "repos\emulebb-build"
          python -m emule_workspace audit-artifacts

      - name: Resolve artifact upload paths
        id: artifact_paths
        if: ${{ always() }}
        shell: pwsh
        env:
          ARTIFACT_PATH_INPUT: ${{ inputs.artifact_path }}
          FAILURE_ARTIFACT_PATH_INPUT: ${{ inputs.failure_artifact_path }}
        run: |
          $ErrorActionPreference = "Stop"

          function Resolve-ArtifactPathInput {
            param([string]$RawInput)

            if ([string]::IsNullOrWhiteSpace($RawInput)) {
              return @()
            }

            $outputChildren = @(
              "artifacts",
              "builds",
              "cache",
              "logs",
              "packages",
              "profiles",
              "release",
              "reports",
              "tmp",
              "tools"
            )

            $resolved = New-Object System.Collections.Generic.List[string]
            foreach ($line in ($RawInput -split "`r?`n")) {
              $pathText = $line.Trim()
              if ([string]::IsNullOrWhiteSpace($pathText)) {
                continue
              }

              $expanded = [Environment]::ExpandEnvironmentVariables($pathText)
              $expanded = $expanded.Replace('${{ env.EMULEBB_WORKSPACE_OUTPUT_ROOT }}', $env:EMULEBB_WORKSPACE_OUTPUT_ROOT)
              $expanded = $expanded.Replace('${{ env.EMULEBB_WORKSPACE_ROOT }}', $env:EMULEBB_WORKSPACE_ROOT)

              if ([System.IO.Path]::IsPathRooted($expanded)) {
                $resolved.Add($expanded)
                continue
              }

              $firstPart = ($expanded -split '[\\/]')[0]
              if ($outputChildren -contains $firstPart) {
                $resolved.Add((Join-Path $env:EMULEBB_WORKSPACE_OUTPUT_ROOT $expanded))
              } else {
                $resolved.Add((Join-Path $env:GITHUB_WORKSPACE $expanded))
              }
            }

            return $resolved.ToArray()
          }

          function Write-MultilineOutput {
            param(
              [string]$Name,
              [string[]]$Value
            )

            $delimiter = "EOF_$([Guid]::NewGuid().ToString('N'))"
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$Name<<$delimiter"
            foreach ($line in $Value) {
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $line
            }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $delimiter
          }

          Write-MultilineOutput -Name "artifact_path" -Value (Resolve-ArtifactPathInput $env:ARTIFACT_PATH_INPUT)
          Write-MultilineOutput -Name "failure_artifact_path" -Value (Resolve-ArtifactPathInput $env:FAILURE_ARTIFACT_PATH_INPUT)

      - name: Upload failure artifacts
        if: ${{ failure() && inputs.failure_artifact_name != '' && inputs.failure_artifact_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.failure_artifact_name }}
          path: ${{ steps.artifact_paths.outputs.failure_artifact_path }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.failure_artifact_retention_days }}

      - name: Upload artifacts
        if: ${{ inputs.artifact_name != '' && inputs.artifact_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.artifact_paths.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
