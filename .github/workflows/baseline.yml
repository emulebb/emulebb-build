name: Baseline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    uses: emulebb/emulebb-tooling/.github/workflows/reusable-baseline.yml@856e0499d12e281697618cc81a0b09805e96f59e
    with:
      policy_path: manifests/privacy-guard/policy.v1.json
      repo_kind: emulebb-build
      extra_commands: |
        python -m pip install -e .[dev]
        python -m pytest tests/test_ci_workflows.py tests/test_workstreams.py tests/test_local_checks.py tests/test_python_runtime.py tests/test_cli.py tests/test_linux_containers.py
      tooling_ref: 856e0499d12e281697618cc81a0b09805e96f59e
