name: Baseline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    uses: emulebb/emulebb-tooling/.github/workflows/reusable-baseline.yml@96825d9f3e2d8241abd8aa6a39a33bfdd7c9c264
    with:
      policy_path: manifests/privacy-guard/policy.v1.json
      repo_kind: emulebb-build
      extra_commands: |
        python -m pip install -e .[dev]
        python -m pytest tests/test_ci_workflows.py
      tooling_ref: 96825d9f3e2d8241abd8aa6a39a33bfdd7c9c264
