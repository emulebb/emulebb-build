name: Android debug APK smoke

on:
  workflow_dispatch:
    inputs:
      rust_sha:
        description: Exact current emulebb-rust main SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Build x86_64 debug APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      manifest: ${{ steps.package.outputs.manifest }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      signer_sha256: ${{ steps.package.outputs.signer_sha256 }}
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}/repos/emulebb-rust
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/repos/emulebb-tooling
      MINIUPNP_ROOT: ${{ github.workspace }}/repos/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/repos/emulebb-libpcpnatpmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/emulebb-build
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-rust
          ref: refs/heads/main
          path: repos/emulebb-rust
          persist-credentials: false
      - name: Verify requested official Rust main
        env:
          RUST_SHA: ${{ inputs.rust_sha }}
        run: test "$(git -C "$EMULEBB_RUST_REPO" rev-parse HEAD)" = "$RUST_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-tooling
          ref: 0163a64c2139a32e60c427c7559501ab887b536e
          path: repos/emulebb-tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-miniupnp
          ref: 4e7a10948004ca2085ac8103e14fc77edb898b4c
          path: repos/emulebb-miniupnp
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-libpcpnatpmp
          ref: a6e787f837e507336a8774522c33b54264ef4a4b
          path: repos/emulebb-libpcpnatpmp
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: python -m pip install click==8.4.1 pydantic==2.14.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm install --global npm@11.20.0
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.6.1
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.35.0
          driver: docker
          use: false
      - name: Build one debug-signed APK
        id: package
        working-directory: repos/emulebb-build
        env:
          RUST_SHA: ${{ inputs.rust_sha }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/android-debug-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/android-debug-out/builds/rust/target
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          python -B -m emule_workspace package-rust-android-debug-apk-ci \
            --source-sha "$RUST_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Retain immutable test APK
        id: retain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-x86_64-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.payload }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain debug APK build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-build-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-debug-out/reports/android-apk/**/*.log
            ${{ runner.temp }}/android-debug-out/reports/android-apk/**/build.json
          if-no-files-found: warn
          retention-days: 14

  smoke:
    name: Smoke retained APK on x86_64 emulator
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/emulebb-build
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: 69b65319b355414c2579aeb9e926cb644a6ce062
          path: repos/emulebb-build-tests
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Grant this hosted runner account access to KVM
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Prepare headless emulator runtime libraries
        run: |
          # Keep this runtime set aligned with Dockerfile.emulator.
          missing=()
          for package in libasound2t64 libdbus-1-3 libegl1 libgl1 libnss3 libpulse0 libxcb1 libx11-6 libxkbcommon0; do
            if [[ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null)" != installed ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Download exact producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/android-debug-out/payload
      - name: Install, launch and uninstall the exact debug APK
        working-directory: repos/emulebb-build
        env:
          RUST_SHA: ${{ inputs.rust_sha }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/android-debug-out
          APK_MANIFEST: ${{ needs.package.outputs.manifest }}
          APK_MANIFEST_SHA: ${{ needs.package.outputs.manifest_sha256 }}
          APK_SIGNER_SHA: ${{ needs.package.outputs.signer_sha256 }}
        run: |
          python -B -m emule_workspace test-rust-android-debug-apk-ci \
            --manifest "$EMULEBB_WORKSPACE_OUTPUT_ROOT/payload/$APK_MANIFEST" \
            --manifest-sha256 "$APK_MANIFEST_SHA" --source-sha "$RUST_SHA" \
            --certificate-sha256 "$APK_SIGNER_SHA"
      - name: Retain smoke and emulator receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-smoke-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-debug-out/reports/android-debug-apk-smoke/smoke.json
            ${{ runner.temp }}/android-debug-out/reports/android-debug-apk-smoke/emulator.json
          if-no-files-found: error
          retention-days: 14
